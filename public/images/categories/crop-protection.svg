<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with subtle agricultural contour waves -->
  <rect width="600" height="360" fill="url(#cpBg)" />
  <path d="M0 260 Q 150 210, 300 250 T 600 220 L 600 360 L 0 360 Z" fill="#047857" opacity="0.4" />
  <path d="M0 290 Q 200 240, 400 280 T 600 260 L 600 360 L 0 360 Z" fill="#064e3b" opacity="0.6" />

  <!-- Center Decorative Glow -->
  <circle cx="300" cy="180" r="140" fill="#34d399" opacity="0.2" filter="blur(20px)" />

  <!-- Protective Shield -->
  <g filter="url(#cardGlow)">
    <path d="M 300 70 L 390 110 C 390 220, 300 265, 300 265 C 300 265, 210 220, 210 110 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" />
    
    <!-- Shield Inner Bevel -->
    <path d="M 300 82 L 378 116 C 378 210, 300 250, 300 250 C 300 250, 222 210, 222 116 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    
    <!-- Healthy Green Leaf inside Shield -->
    <path d="M 300 110 C 350 140, 345 210, 300 230 C 255 210, 250 140, 300 110 Z" fill="url(#leafGrad)" />
    <path d="M 300 120 L 300 220" stroke="#14532d" stroke-width="3" stroke-linecap="round" />
    <path d="M 300 150 Q 320 140 330 145" stroke="#14532d" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 300 170 Q 280 160 270 165" stroke="#14532d" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 300 190 Q 320 180 328 185" stroke="#14532d" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Dew Drop on Leaf -->
    <circle cx="316" cy="165" r="5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Sparkles / Bio Protection Highlights -->
  <g fill="#fef08a">
    <path d="M 440 100 Q 450 100 450 90 Q 450 100 460 100 Q 450 100 450 110 Q 450 100 440 100 Z" />
    <path d="M 150 150 Q 160 150 160 140 Q 160 150 170 150 Q 160 150 160 160 Q 160 150 150 150 Z" />
    <path d="M 430 240 Q 438 240 438 232 Q 438 240 446 240 Q 438 240 438 248 Q 438 240 430 240 Z" />
  </g>

  <!-- Bottom Label Bar -->
  <rect x="160" y="295" width="280" height="38" rx="19" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.3)" />
  <text x="300" y="320" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    CROP PROTECTION &amp; CARE
  </text>
</svg>

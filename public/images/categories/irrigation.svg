<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="irrigBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="irrigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#irrigBg)" />
  
  <!-- Subtle Water Wave Ripples -->
  <path d="M 0 240 Q 150 210, 300 240 T 600 240 L 600 360 L 0 360 Z" fill="#0284c7" opacity="0.35" />
  <path d="M 0 280 Q 200 250, 400 280 T 600 280 L 600 360 L 0 360 Z" fill="#0c4a6e" opacity="0.5" />

  <!-- Center Decorative Glow -->
  <circle cx="300" cy="170" r="130" fill="#38bdf8" opacity="0.25" filter="blur(25px)" />

  <!-- Drip Lateral Pipe -->
  <g filter="url(#irrigShadow)">
    <!-- Main Black Lateral Pipe -->
    <rect x="50" y="190" width="500" height="28" rx="14" fill="url(#pipeGrad)" stroke="#64748b" stroke-width="2" />
    <line x1="50" y1="200" x2="550" y2="200" stroke="#94a3b8" stroke-width="2" opacity="0.4" />

    <!-- Drip Emitters -->
    <rect x="150" y="184" width="22" height="40" rx="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    <rect x="300" y="184" width="22" height="40" rx="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    <rect x="450" y="184" width="22" height="40" rx="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Water Drops Dripping from emitters -->
    <path d="M 161 230 C 166 238, 172 248, 161 254 C 150 248, 156 238, 161 230 Z" fill="url(#dropGrad)" />
    <path d="M 461 230 C 466 238, 472 248, 461 254 C 450 248, 456 238, 461 230 Z" fill="url(#dropGrad)" />

    <!-- Large Iconic Center Droplet -->
    <path d="M 311 65 C 335 110, 360 145, 311 165 C 262 145, 287 110, 311 65 Z" fill="url(#dropGrad)" stroke="#ffffff" stroke-width="3" />
    <!-- Droplet Highlight Reflection -->
    <ellipse cx="320" cy="120" rx="8" ry="16" fill="#ffffff" opacity="0.6" transform="rotate(-20 320 120)" />

    <!-- Soil Wetting Pattern / Rings -->
    <ellipse cx="311" cy="275" rx="75" ry="14" fill="#38bdf8" opacity="0.3" />
    <ellipse cx="311" cy="275" rx="45" ry="9" fill="#bae6fd" opacity="0.4" />
    <ellipse cx="161" cy="265" rx="35" ry="7" fill="#38bdf8" opacity="0.3" />
    <ellipse cx="461" cy="265" rx="35" ry="7" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- Bottom Label Bar -->
  <rect x="170" y="300" width="260" height="38" rx="19" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(255, 255, 255, 0.3)" />
  <text x="300" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    DRIP &amp; IRRIGATION SUPPLIES
  </text>
</svg>

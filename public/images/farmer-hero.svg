<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="fieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Farmland background glow circle -->
  <circle cx="160" cy="160" r="140" fill="url(#fieldGlow)"/>

  <!-- Agricultural field rows in distance -->
  <path d="M 40,250 Q 160,220 280,250" stroke="#86efac" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 20,270 Q 160,240 300,270" stroke="#4ade80" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- Farmer Figure -->
  <g id="farmer" transform="translate(160, 160)">
    <!-- White Kurta / Shirt Body -->
    <path d="M -55,60 C -60,95 -45,150 -35,160 L 35,160 C 45,150 60,95 55,60 C 40,55 25,52 0,52 C -25,52 -40,55 -55,60 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="52" x2="0" y2="120" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Traditional Towel / Gamcha draped over shoulder (light yellow / beige with red border) -->
    <path d="M 25,55 C 38,75 44,115 42,160 L 26,160 C 26,120 22,80 14,54 Z" fill="#fef08a" stroke="#ca8a04"/>
    <line x1="28" y1="55" x2="40" y2="160" stroke="#dc2626" stroke-width="2"/>

    <!-- Neck -->
    <rect x="-14" y="25" width="28" height="30" rx="6" fill="#d97706"/>

    <!-- Head / Face -->
    <ellipse cx="0" cy="10" rx="30" ry="34" fill="#f59e0b"/>
    <!-- Cheerful Smile & Mustache -->
    <path d="M -16,22 Q 0,34 16,22" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -22,18 Q -10,12 0,16 Q 10,12 22,18 C 16,25 0,26 -22,18 Z" fill="#451a03"/>
    
    <!-- Eyes with warm expression -->
    <ellipse cx="-12" cy="4" rx="3.5" ry="4" fill="#1c1917"/>
    <ellipse cx="12" cy="4" rx="3.5" ry="4" fill="#1c1917"/>
    <circle cx="-13" cy="2.5" r="1.2" fill="#ffffff"/>
    <circle cx="11" cy="2.5" r="1.2" fill="#ffffff"/>
    <!-- Eyebrows -->
    <path d="M -18,-5 Q -10,-10 -4,-6" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 18,-5 Q 10,-10 4,-6" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Tilak / Bindi on forehead -->
    <path d="M -4,-8 L 4,-8 L 0,-15 Z" fill="#dc2626"/>

    <!-- Farmer Hair / Turban -->
    <path d="M -30,-8 C -32,-30 -10,-42 0,-42 C 10,-42 32,-30 30,-8 C 24,-24 0,-30 -30,-8 Z" fill="#292524"/>

    <!-- Arm with Thumbs-up gesture -->
    <g transform="translate(-50, 75)">
      <!-- Left arm sleeve -->
      <path d="M 0,0 C -25,10 -35,35 -20,60 L -6,54 C -18,35 -10,18 8,-4 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Hand giving Thumbs up -->
      <circle cx="-20" cy="62" r="14" fill="#f59e0b"/>
      <!-- Thumb pointing up -->
      <path d="M -24,56 C -28,45 -22,34 -15,36 C -12,38 -14,50 -16,56 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
      <circle cx="-16" cy="36" r="4.5" fill="#f59e0b"/>
    </g>
  </g>
</svg>
